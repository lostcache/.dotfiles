# ── General ───────────────────────────────────────────────────────────────────
set -g default-shell /usr/bin/zsh
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g mouse on
set -g escape-time 0
set -g focus-events on
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"

# ── Vi mode ───────────────────────────────────────────────────────────────────
setw -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi Escape send-keys -X cancel

# ── Status bar ────────────────────────────────────────────────────────────────
# Vague palette:
#   bg       #141415   surface  #252530   elevated #333738
#   fg       #cdcdcd   fg_dim   #606079
#   accent   #c48282   blue     #6e94b2   lavender #aeaed1

set -g status on
set -g status-position bottom
set -g status-interval 5
set -g status-justify left
set -g status-style "bg=default,fg=#cdcdcd"

# Left — session name pill
set -g status-left "#[fg=#c48282,bg=#252530,bold]  #S #[fg=#252530,bg=default,nobold]"
set -g status-left-length 40

# Right — empty
set -g status-right ""

# Windows
set -g window-status-separator ""
set -g window-status-format         "#[fg=#606079,bg=default]  #I  #W "
set -g window-status-current-format "#[fg=#333738,bg=default,nobold]#[fg=#cdcdcd,bg=#333738,bold]  #I  #W  #[fg=#333738,bg=default,nobold]"

# ── Pane borders ──────────────────────────────────────────────────────────────
set -g pane-border-style        "fg=#252530"
set -g pane-active-border-style "fg=#c48282"
set -g pane-border-lines        single

# ── Messages / command prompt ─────────────────────────────────────────────────
set -g message-style         "bg=#252530,fg=#cdcdcd"
set -g message-command-style "bg=#252530,fg=#606079"

# ── Copy / selection mode ─────────────────────────────────────────────────────
set -g mode-style "bg=#333738,fg=#cdcdcd"
