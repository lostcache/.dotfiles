# Set status bar background to transparent
set -g status-style bg=default
set -g status-left-style bg=default
set -g status-right-style bg=default

# Remove date and time from the right side
set -g status-right ""

# Set window status backgrounds to transparent
set -g window-status-style bg=default
set -g window-status-current-style bg=default

# Transparent messages and command prompt
set -g message-style bg=default
set -g message-command-style bg=default
